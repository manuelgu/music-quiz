name = "music-quiz"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Serve on <name>.<account>.workers.dev. Per-version preview URLs are off: Spotify
# login only works on addresses registered as Redirect URIs.
workers_dev = true
preview_urls = false

# index.html (host) and play.html (team phones) are served as static assets;
# anything that isn't a file (/api/*, /ABCD short links) goes to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
